<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Optional material host acceptance fixture</title>
<link rel="stylesheet" href="../../../v/0.1.3/tokens.css">
<link rel="stylesheet" href="../../../v/0.1.3/bundle.css">
<style>body{margin:1rem}main{max-width:48rem;margin:auto}canvas{width:100%;height:auto;aspect-ratio:8/5;display:block}label,button{display:inline-block;margin:.5rem}pre{white-space:pre-wrap}</style>
<main><h1>One state, eight materials</h1><p>Experimental host fixture. The appearance changes; the traveller and score do not. Rendering happens only when requested. No game assets are included.</p>
<label>Material <select id="look"></select></label><label>Layer <select id="layer"><option>surface</option><option>subterrain</option></select></label>
<button id="step">Move traveller</button><button id="off">Disable materials</button>
<canvas width="480" height="300" aria-label="Decorative scene behind a white traveller marker"></canvas><p id="status" role="status"></p></main>
<script src="../../../v/0.1.3/bundle.js"></script>
<script type="module">
import {createRenderer,materials,version} from '../v/0.2.0-materials.1/materials.mjs';
const stable = window.Hypermetapunk;
const renderer = createRenderer({createCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}});
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d');
const look=document.querySelector('#look'),layer=document.querySelector('#layer');
const state={x:80,y:220,score:0,seed:1947};let enabled=true;
for(const m of materials){const o=document.createElement('option');o.value=m.id;o.textContent=m.id;look.append(o);}
function draw(){
 const width=Math.min(2048,Math.max(1,Math.round(canvas.getBoundingClientRect().width*Math.min(2,devicePixelRatio))));
 const height=Math.round(width*5/8);
 if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,canvas.width,canvas.height);
 if(enabled)renderer.render(g,{look:look.value,layer:layer.value,seed:state.seed,detail:.3});
 else {g.fillStyle='#202030';g.fillRect(0,0,canvas.width,canvas.height);}
 g.save();g.scale(canvas.width/480,canvas.height/300);
 g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=3;g.beginPath();g.arc(state.x,state.y,7,0,Math.PI*2);g.fill();g.stroke();g.restore();
 document.querySelector('#status').textContent=`Position ${state.x}, ${state.y}. Score ${state.score}. Materials ${enabled?'on':'off'}.`;
}
look.onchange=layer.onchange=draw;
document.querySelector('#step').onclick=()=>{state.x=(state.x+20)%460;state.score++;draw();};
document.querySelector('#off').onclick=()=>{enabled=!enabled;draw();};
addEventListener('resize',draw);
window.hostFixture={version,state,draw,stable,renderer};draw();
</script></html>
