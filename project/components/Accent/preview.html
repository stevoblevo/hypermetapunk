<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Accent</title><style>html,body{margin:0}body.hmp-body{min-height:0;padding:20px;box-sizing:border-box}</style></head><body class="hmp-body"><fieldset class="hmp-accents"><legend>Make the accent yours</legend>
  <div class="hmp-accents__row">
    <button class="hmp-btn hmp-btn--ghost" type="button" data-hmp-accent="#e8ff00"><span class="hmp-accent-swatch" style="--swatch:#e8ff00" aria-hidden="true"></span>Acid</button>
    <button class="hmp-btn hmp-btn--ghost" type="button" data-hmp-accent="#ff5cba"><span class="hmp-accent-swatch" style="--swatch:#ff5cba" aria-hidden="true"></span>Pink</button>
    <button class="hmp-btn hmp-btn--ghost" type="button" data-hmp-accent="#7fe9ff"><span class="hmp-accent-swatch" style="--swatch:#7fe9ff" aria-hidden="true"></span>Cyan</button>
    <button class="hmp-btn hmp-btn--ghost" type="button" data-hmp-accent="#05ffa1"><span class="hmp-accent-swatch" style="--swatch:#05ffa1" aria-hidden="true"></span>Mint</button>
    <button class="hmp-btn hmp-btn--ghost" type="button" data-hmp-accent="#ff914d"><span class="hmp-accent-swatch" style="--swatch:#ff914d" aria-hidden="true"></span>Orange</button>
    <label>Custom colour <input type="color" value="#e8ff00" data-hmp-accent-input></label>
    <button class="hmp-btn hmp-btn--ghost" type="button" data-hmp-accent-reset>Reset accent</button>
  </div>
  <p class="hmp-accents__status" data-hmp-accent-status role="status" aria-live="polite">Using this theme’s original accent.</p>
</fieldset><p><button class="hmp-btn hmp-btn--accent" type="button">Accent button</button> <span class="hmp-stamp">Your accent</span></p></body></html>
