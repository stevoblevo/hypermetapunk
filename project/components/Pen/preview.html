<!-- @dsCard group="Horizon" height=590 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pen</title>
<style>html,body{margin:0}body.hmp-body{min-height:0}.pv-pen{padding:18px 20px 16px;display:grid;gap:10px}.pv-pen canvas{display:block;width:100%;height:270px;border:var(--border-thick, 3px) solid var(--line)}.pv-pen #pv-pen-s{height:190px}.pv-pen .hmp-label{margin:0}</style></head>
<body class="hmp-body">
<div class="pv-pen">
<canvas id="pv-pen-c" role="img" aria-label="The horizon drawn on canvas by the pen: toner bands down to a banded sun on the right, a grid floor below, the word AND SO in chrome lettering on the left and a line of misregistered type."></canvas>
<p class="hmp-label">Hypermetapunk.pen(theme) · sky, sun, floor, chrome, misreg, grain</p>
<canvas id="pv-pen-s" role="img" aria-label="A small drawn creature, a round mint critter with one eye and two antennae, die-cut as a sticker three times: in Dusk with a white keyline, a pink slap shadow and slipped plates; in Zine on paper with a black edge and a black shadow; in High contrast with a solid white keyline."></canvas>
<p class="hmp-label">pen.sticker(ctx, drawing, x, y, { w, h, slip, angle }) · any drawing, die-cut, in Dusk, Zine and High contrast</p>
</div>
<script src="../pen.js"></script>
<script>
(function () {
  var c = document.getElementById('pv-pen-c'), s = document.getElementById('pv-pen-s'), H = window.Hypermetapunk, t0 = performance.now(), raf = 0;
  if (!c || !H || !H.pen) return;
  /* a host's own drawing, redrawn every frame: a round critter that bobs and blinks (any canvas or image will do) */
  var art = document.createElement('canvas'), A = 3; art.width = 96 * A; art.height = 104 * A;
  function critter(t, P) {
    var k = art.getContext('2d'), b = Math.sin(t * 3) * 3, blink = (t % 3.3) < 0.12;
    k.setTransform(A, 0, 0, A, 0, 0); k.clearRect(0, 0, 96, 104); k.lineJoin = k.lineCap = 'round'; k.lineWidth = 3.2; k.strokeStyle = P.rgb('punk-ink');
    k.fillStyle = P.rgb(P.look === 'contrast' ? 'surface-raised' : 'wave-cyan');   /* feet, behind */
    k.beginPath(); k.ellipse(33, 93 + b * 0.4, 11, 7, 0, 0, Math.PI * 2); k.fill(); k.stroke(); k.beginPath(); k.ellipse(63, 93 + b * 0.4, 11, 7, 0, 0, Math.PI * 2); k.fill(); k.stroke();
    [[-1, 30], [1, 66]].forEach(function (e) {   /* two antennae with bulbs */
      k.beginPath(); k.moveTo(e[1], 36 + b); k.quadraticCurveTo(e[1] + e[0] * 2, 22 + b, e[1] + e[0] * 9, 15 + b); k.stroke();
      k.fillStyle = P.rgb(e[0] < 0 ? 'punk-acid' : 'chrome-4'); k.beginPath(); k.arc(e[1] + e[0] * 9, 13 + b, 5.5, 0, Math.PI * 2); k.fill(); k.lineWidth = 2.6; k.stroke(); k.lineWidth = 3.2;
    });
    k.fillStyle = P.rgb(P.look === 'contrast' ? 'void' : 'wave-mint');
    k.beginPath(); k.ellipse(48, 60 + b, 36, 32, 0, 0, Math.PI * 2); k.fill(); k.stroke();
    k.fillStyle = P.rgb('punk-paper'); k.beginPath(); k.ellipse(48, 54 + b, 15, blink ? 2 : 13, 0, 0, Math.PI * 2); k.fill(); k.stroke();
    if (!blink) { k.fillStyle = P.rgb('punk-ink'); k.beginPath(); k.arc(52, 56 + b, 6, 0, Math.PI * 2); k.fill(); k.fillStyle = '#fff'; k.beginPath(); k.arc(54.5, 53.5 + b, 2, 0, Math.PI * 2); k.fill(); }
    k.beginPath(); k.moveTo(39, 75 + b); k.quadraticCurveTo(48, 81 + b, 57, 75 + b); k.stroke();
    k.fillStyle = P.rgb(P.look === 'contrast' ? 'ink' : 'chrome-4'); k.globalAlpha = 0.55; k.beginPath(); k.ellipse(24, 70 + b, 5, 3, 0, 0, Math.PI * 2); k.ellipse(72, 70 + b, 5, 3, 0, 0, Math.PI * 2); k.fill(); k.globalAlpha = 1;
    return art;
  }
  function draw(now) {
    var dpr = Math.min(2, window.devicePixelRatio || 1), w = c.clientWidth, h = c.clientHeight, x = c.getContext('2d'), P = H.pen(c), t = (now - t0) / 1000, held = H.reducedMotion();
    if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    var hy = P.horizon(x, { w: w, h: h, at: 0.6, sunR: h * 0.22, sunX: w * 0.74, t: t });
    P.chrome(x, 'AND SO', 24, hy - 26, { size: Math.min(84, w * 0.11) });
    P.misreg(x, 'one state, many faces', 26, hy + 34, { size: 18, font: 'system-ui, sans-serif', weight: '700', ink: P.light ? 'ink' : 'punk-paper' });
    P.grain(x, { w: w, h: h });
    /* the sticker strip: the same drawing slapped in each theme, on that theme's ground */
    var sw = s.clientWidth, sh = s.clientHeight, y = s.getContext('2d'), third = sw / 3, tt = held ? 0 : t;
    if (s.width !== Math.round(sw * dpr)) { s.width = Math.round(sw * dpr); s.height = Math.round(sh * dpr); }
    y.setTransform(dpr, 0, 0, dpr, 0, 0);
    ['dusk', 'zine', 'contrast'].forEach(function (look, i) {
      var Q = H.pen(look), size = Math.min(sh * 0.66, third * 0.6);
      y.fillStyle = Q.rgb(look === 'zine' ? 'paper' : 'void'); y.fillRect(i * third, 0, third, sh);
      if (look === 'dusk') Q.sky(y, { x: i * third, y: 0, w: third, h: sh, steps: 8, span: 0.62 });
      Q.sticker(y, critter(tt, Q), i * third + third / 2, sh / 2 + 4, { h: size, w: size * 96 / 104, slip: held ? 2 : 2 + 1.5 * Math.max(0, Math.sin(tt * 2.6)), angle: held ? -0.05 : 0.07 * Math.sin(tt * 1.3 + i) });
    });
    if (!held) raf = requestAnimationFrame(draw);
  }
  function again() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
  window.addEventListener('hmp:theme', again); window.addEventListener('hmp:still', again); window.addEventListener('resize', again);
  new MutationObserver(again).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
  again();
})();
</script>
</body></html>
